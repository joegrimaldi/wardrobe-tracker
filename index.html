<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wardrobe">
<meta name="theme-color" content="#151A1F">
<title>Wardrobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WARDROBE — care-label visual system
   Palette drawn from the closet itself: selvedge indigo ground,
   raw canvas type, brass hardware accent, rust for anything
   the data can't vouch for.
   ============================================================ */
:root{
  --ground:#151A1F;
  --panel:#1E252C;
  --panel-hi:#28313A;
  --rule:#333F4A;
  --ecru:#E7E1D3;
  --ecru-dim:#96A0AA;
  --chalk:#FFFFFF;
  --brass:#C99A3B;
  --indigo:#5B87C4;
  --rust:#C4573A;
  --sage:#7FA07A;

  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --cond:'IBM Plex Sans Condensed',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,sans-serif;

  --tap:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ecru);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.45;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font-family:inherit;font-size:16px}

/* ---- care-label micro type -------------------------------- */
.lbl{
  font-family:var(--cond);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  color:var(--ecru-dim);
}

/* ---- header ------------------------------------------------ */
header{
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:20;
  background:var(--ground);
}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{
  font-family:var(--cond);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.22em;
  font-size:15px;
  margin:0;
  color:var(--chalk);
}
.stamp{
  font-family:var(--mono);
  font-size:11px;
  color:var(--brass);
  border:1px solid var(--brass);
  padding:2px 7px;
  letter-spacing:.06em;
}

/* ---- freshness footer strip -------------------------------- */
#freshness{
  margin-top:10px;
  font-family:var(--mono);
  font-size:11px;
  color:var(--ecru-dim);
  display:flex;flex-wrap:wrap;gap:4px 14px;
  align-items:center;
}
#freshness b{color:var(--ecru);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sage);display:inline-block;margin-right:6px}
.dot.stale{background:var(--brass)}
.dot.dead{background:var(--rust)}

/* ---- loud error -------------------------------------------- */
#err{
  display:none;
  margin:0;
  padding:14px 18px;
  background:var(--rust);
  color:#fff;
  font-family:var(--mono);
  font-size:13px;
  line-height:1.5;
  border-bottom:2px solid #fff;
}
#err.show{display:block}
#err .lbl{color:rgba(255,255,255,.85);display:block;margin-bottom:5px}

/* ---- controls row ------------------------------------------ */
.controls{
  display:flex;gap:10px;padding:14px 18px 4px;flex-wrap:wrap;align-items:flex-end;
}
.field{display:flex;flex-direction:column;gap:5px}
.field input,.field select{
  background:var(--panel);
  border:1px solid var(--rule);
  color:var(--ecru);
  padding:9px 10px;
  font-family:var(--mono);
  border-radius:0;
}
.field input:focus-visible,.field select:focus-visible,button:focus-visible{
  outline:2px solid var(--brass);outline-offset:2px;
}

/* ---- layer sections ---------------------------------------- */
section.layer{padding:18px 18px 0}
.layerhead{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.layerhead .rule{flex:1;height:1px;background:var(--rule)}

/* ---- item rows: the care label ----------------------------- */
.item{
  display:flex;align-items:center;gap:12px;
  width:100%;text-align:left;
  min-height:var(--tap);
  padding:9px 12px;
  background:var(--panel);
  border:1px solid var(--rule);
  margin-bottom:7px;
  transition:background .12s ease,border-color .12s ease;
}
.item[aria-pressed="true"]{
  background:var(--panel-hi);
  border-color:var(--brass);
}
.tag{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.04em;
  color:var(--ground);
  background:var(--ecru-dim);
  padding:3px 6px;
  flex:0 0 auto;
  min-width:60px;
  text-align:center;
}
.item[aria-pressed="true"] .tag{background:var(--brass);color:var(--ground)}
.itemmain{flex:1;min-width:0}
.itemname{
  font-family:var(--cond);
  font-weight:600;
  font-size:16px;
  color:var(--ecru);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.item[aria-pressed="true"] .itemname{color:var(--chalk)}
.itemmeta{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ecru-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.unverified{color:var(--rust)}
.check{
  font-family:var(--mono);font-size:18px;color:var(--brass);
  flex:0 0 auto;width:18px;text-align:center;opacity:0;
}
.item[aria-pressed="true"] .check{opacity:1}

/* ---- empty / loading --------------------------------------- */
.notice{
  margin:28px 18px;padding:20px;
  border:1px dashed var(--rule);
  font-family:var(--mono);font-size:13px;color:var(--ecru-dim);
  line-height:1.6;
}
.notice b{color:var(--ecru);font-weight:500}

/* ---- bottom bar: the tear-off ------------------------------ */
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--panel);
  border-top:1px solid var(--rule);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:10px;align-items:center;
}
#bar::before{
  content:'';position:absolute;top:-5px;left:0;right:0;height:4px;
  background-image:radial-gradient(circle at 4px 2px,var(--rule) 1.5px,transparent 1.6px);
  background-size:9px 4px;
}
#tally{
  font-family:var(--mono);font-size:12px;color:var(--ecru-dim);
  flex:1;line-height:1.35;
}
#tally b{color:var(--chalk);font-weight:600}
.btn{
  font-family:var(--cond);font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;font-size:13px;
  padding:0 18px;height:var(--tap);
  background:var(--brass);color:var(--ground);
  flex:0 0 auto;
}
.btn:disabled{background:var(--rule);color:var(--ecru-dim);cursor:default}
.btn.ghost{background:none;border:1px solid var(--rule);color:var(--ecru);padding:0 14px}

/* ---- sign in / add sheet ----------------------------------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:rgba(10,13,16,.86);
  display:none;align-items:flex-end;
}
.sheet.show{display:flex}
.sheetinner{
  width:100%;background:var(--ground);border-top:2px solid var(--brass);
  padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;
}
.sheetinner h2{
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.18em;
  font-size:14px;margin:0 0 4px;color:var(--chalk);font-weight:700;
}
.sheetinner p{font-family:var(--mono);font-size:12px;color:var(--ecru-dim);margin:0 0 18px}
.sheetinner .field{margin-bottom:14px}
.sheetinner .field input,.sheetinner .field select{width:100%}
.rowbtns{display:flex;gap:10px;margin-top:6px}
.rowbtns .btn{flex:1;justify-content:center;display:flex;align-items:center}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom));z-index:80;
  background:var(--ecru);color:var(--ground);
  font-family:var(--mono);font-size:12px;padding:10px 16px;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
#toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ============================================================
     CONFIGURE ME — two lines, then this file is done.
     The publishable (anon) key is safe in a public repo: RLS
     grants access only to authenticated sessions.
     Supabase dashboard -> Project Settings -> API Keys
     ============================================================ -->
<script>
  window.WARDROBE_CONFIG = {
    url: 'https://sobshyactzxhtsayemkj.supabase.co',
    key: 'sb_publishable_bEjEjiIRdyYKxynJmw_OiQ_NU-8h4Gq'
  };
</script>

<header>
  <div class="brandrow">
    <h1>Wardrobe</h1>
    <span class="stamp" id="backlog">—</span>
  </div>
  <div id="freshness"><span class="dot dead"></span>Connecting…</div>
</header>

<div id="err" role="alert"></div>

<div class="controls">
  <div class="field">
    <label class="lbl" for="worn">Worn on</label>
    <input type="date" id="worn">
  </div>
  <div class="field">
    <label class="lbl" for="slot">Slot</label>
    <select id="slot">
      <option value="primary">Primary</option>
      <option value="evening">Evening</option>
      <option value="gym">Gym</option>
      <option value="bed">Bed</option>
      <option value="travel">Travel</option>
    </select>
  </div>
  <button class="btn ghost" id="repeat" style="height:40px">Repeat last</button>
</div>

<main id="closet"></main>

<div id="bar">
  <div id="tally"><b>0</b> selected</div>
  <button class="btn ghost" id="addbtn">+ Item</button>
  <button class="btn" id="save" disabled>Save</button>
</div>

<!-- sign in -->
<div class="sheet" id="authsheet">
  <div class="sheetinner">
    <h2>Sign in</h2>
    <p>Your wardrobe is locked to your account. One sign-in per device.</p>
    <div class="field"><label class="lbl" for="email">Email</label><input type="email" id="email" autocomplete="username"></div>
    <div class="field"><label class="lbl" for="pw">Password</label><input type="password" id="pw" autocomplete="current-password"></div>
    <div class="rowbtns"><button class="btn" id="signin">Sign in</button></div>
  </div>
</div>

<!-- add item -->
<div class="sheet" id="addsheet">
  <div class="sheetinner">
    <h2>Add an item</h2>
    <p>Name it now, price it later. It lands in the backlog until a receipt turns up.</p>
    <div class="field"><label class="lbl" for="nname">Name</label><input type="text" id="nname" placeholder="Sebago boat shoes, blue"></div>
    <div class="field"><label class="lbl" for="nlayer">Layer</label>
      <select id="nlayer">
        <option value="shirt">Shirt</option><option value="pants">Pants</option>
        <option value="outer">Outer</option><option value="shoes">Shoes</option>
        <option value="accessory">Accessory</option><option value="other">Other</option>
      </select>
    </div>
    <div class="field"><label class="lbl" for="ncat">Category</label><select id="ncat"></select></div>
    <div class="field"><label class="lbl" for="nclass">Class</label>
      <select id="nclass">
        <option value="wardrobe">Wardrobe — counts toward cost per wear</option>
        <option value="property">Property — logged, not measured</option>
        <option value="collectible">Collectible — provenance only</option>
      </select>
    </div>
    <div class="rowbtns">
      <button class="btn ghost" id="addcancel">Cancel</button>
      <button class="btn" id="addsave">Add</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const CFG = window.WARDROBE_CONFIG;
const $ = s => document.querySelector(s);

/* ------------------------------------------------------------
   Failure is loud. There is no placeholder data in this file,
   deliberately — an empty screen means an empty database, and
   a red banner means a broken query. Those must never look alike.
   ------------------------------------------------------------ */
function fail(where, e){
  const box = $('#err');
  box.innerHTML = '<span class="lbl">Could not ' + where + '</span>' +
                  (e && e.message ? e.message : String(e));
  box.classList.add('show');
  console.error(where, e);
}
function clearErr(){ $('#err').classList.remove('show'); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

if (!CFG.key || CFG.key.startsWith('PASTE_')){
  fail('start', {message:'No Supabase key set. Open index.html and put your publishable key in WARDROBE_CONFIG at the top of the file.'});
  throw new Error('unconfigured');
}

const sb = createClient(CFG.url, CFG.key);

const LAYERS = [
  ['outer','Outer'],['shirt','Shirt'],['pants','Pants'],
  ['shoes','Shoes'],['accessory','Accessory'],['other','Other']
];
const state = { items: [], picked: new Set(), cats: [] };

/* ---------- inventory tag: the physical/digital handle -------- */
const PREFIX = { wardrobe:'WD', collectible:'CL', property:'PR' };
const tagFor = it => (PREFIX[it.item_class]||'WD') + '-' + String(it.id).padStart(3,'0');

/* ---------- auth ---------------------------------------------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ $('#authsheet').classList.add('show'); return; }
  $('#authsheet').classList.remove('show');
  await Promise.all([loadCats(), loadItems()]);
  await freshness();
}
$('#signin').onclick = async () => {
  clearErr();
  const { error } = await sb.auth.signInWithPassword({
    email: $('#email').value.trim(), password: $('#pw').value
  });
  if (error) return fail('sign in', error);
  boot();
};

/* ---------- load ---------------------------------------------- */
async function loadCats(){
  const { data, error } = await sb.from('categories')
    .select('id,name,default_layer').order('sort_order');
  if (error) return fail('load categories', error);
  state.cats = data || [];
  $('#ncat').innerHTML = state.cats
    .map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}

async function loadItems(){
  const { data, error } = await sb.from('items')
    .select('id,name,item_class,layer,brand,unit_price,price_source,status')
    .eq('status','active')
    .order('layer').order('name');
  if (error) return fail('load your closet', error);
  state.items = data || [];
  render();
  backlogCount();
}

/* ---------- render -------------------------------------------- */
function render(){
  const root = $('#closet');
  if (!state.items.length){
    root.innerHTML = `<div class="notice">
      <b>Nothing in the closet yet.</b><br>
      The database is reachable and it is empty — that is a real answer,
      not a failure. Tap <b>+ Item</b> to add the first thing you're wearing.
    </div>`;
    return;
  }
  root.innerHTML = LAYERS.map(([key,label])=>{
    const rows = state.items.filter(i => (i.layer||'other') === key);
    if (!rows.length) return '';
    return `<section class="layer">
      <div class="layerhead"><span class="lbl">${label}</span><span class="rule"></span>
        <span class="lbl">${rows.length}</span></div>
      ${rows.map(itemRow).join('')}
    </section>`;
  }).join('');

  root.querySelectorAll('.item').forEach(el=>{
    el.onclick = () => {
      const id = Number(el.dataset.id);
      state.picked.has(id) ? state.picked.delete(id) : state.picked.add(id);
      el.setAttribute('aria-pressed', state.picked.has(id));
      tally();
    };
  });
  tally();
}

function itemRow(i){
  const verified = i.price_source === 'receipt';
  const price = i.unit_price != null
      ? '$' + Number(i.unit_price).toFixed(2)
      : 'no price';
  const meta = [i.brand, verified ? price : `<span class="unverified">${price} · unverified</span>`]
      .filter(Boolean).join(' · ');
  return `<button class="item" data-id="${i.id}"
            aria-pressed="${state.picked.has(i.id)}">
      <span class="tag">${tagFor(i)}</span>
      <span class="itemmain">
        <span class="itemname">${escapeHtml(i.name)}</span>
        <span class="itemmeta">${meta}</span>
      </span>
      <span class="check">✕</span>
    </button>`;
}
const escapeHtml = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tally(){
  $('#tally').innerHTML = `<b>${state.picked.size}</b> selected`;
  $('#save').disabled = state.picked.size === 0;
}

/* ---------- freshness: three separate facts ------------------- */
async function freshness(){
  try{
    const [itemsHead, outfitsHead, lastItem, lastOutfit] = await Promise.all([
      sb.from('items').select('*',{count:'exact',head:true}),
      sb.from('outfits').select('*',{count:'exact',head:true}),
      sb.from('items').select('created_at').order('created_at',{ascending:false}).limit(1),
      sb.from('outfits').select('created_at').order('created_at',{ascending:false}).limit(1)
    ]);
    const stamps = [lastItem.data?.[0]?.created_at, lastOutfit.data?.[0]?.created_at]
      .filter(Boolean).map(s=>new Date(s));
    const last = stamps.length ? new Date(Math.max(...stamps)) : null;
    const age = last ? (Date.now()-last)/86400000 : Infinity;
    const cls = age < 2 ? '' : age < 14 ? 'stale' : 'dead';
    $('#freshness').innerHTML =
      `<span class="dot ${cls}"></span>` +
      `<span>Last change <b>${last ? ago(last) : 'never'}</b></span>` +
      `<span><b>${itemsHead.count ?? 0}</b> items</span>` +
      `<span><b>${outfitsHead.count ?? 0}</b> outfits</span>`;
  }catch(e){ fail('check freshness', e); }
}
function ago(d){
  const m = Math.floor((Date.now()-d)/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
}

async function backlogCount(){
  const { count, error } = await sb.from('items')
    .select('*',{count:'exact',head:true})
    .or('price_source.is.null,price_source.neq.receipt');
  if (error) return;
  $('#backlog').textContent = (count ?? 0) + ' to price';
}

/* ---------- save the outfit ----------------------------------- */
$('#save').onclick = async () => {
  clearErr();
  const btn = $('#save'); btn.disabled = true; btn.textContent = 'Saving';
  try{
    const worn_on = $('#worn').value;
    const slot = $('#slot').value;

    const { data: outfit, error: e1 } = await sb.from('outfits')
      .upsert({ worn_on, slot, source:'app' }, { onConflict:'worn_on,slot' })
      .select('id').single();
    if (e1) throw e1;

    const { error: e2 } = await sb.from('outfit_items')
      .delete().eq('outfit_id', outfit.id);
    if (e2) throw e2;

    const rows = [...state.picked].map(item_id => ({ outfit_id: outfit.id, item_id }));
    const { error: e3 } = await sb.from('outfit_items').insert(rows);
    if (e3) throw e3;

    toast(`Logged ${rows.length} items for ${worn_on}`);
    await freshness();
  }catch(e){ fail('save the outfit', e); }
  finally{ btn.textContent = 'Save'; tally(); }
};

/* ---------- repeat last outfit -------------------------------- */
$('#repeat').onclick = async () => {
  clearErr();
  try{
    const { data, error } = await sb.from('outfits')
      .select('id,worn_on,outfit_items(item_id)')
      .order('worn_on',{ascending:false}).limit(1);
    if (error) throw error;
    const last = data?.[0];
    if (!last) return toast('No previous outfit to repeat');
    state.picked = new Set((last.outfit_items||[]).map(r=>r.item_id));
    render();
    toast('Filled from ' + last.worn_on);
  }catch(e){ fail('load your last outfit', e); }
};

/* ---------- add an item --------------------------------------- */
$('#addbtn').onclick = () => $('#addsheet').classList.add('show');
$('#addcancel').onclick = () => $('#addsheet').classList.remove('show');
$('#nlayer').onchange = () => {
  const match = state.cats.find(c => c.default_layer === $('#nlayer').value);
  if (match) $('#ncat').value = match.id;
};
$('#addsave').onclick = async () => {
  clearErr();
  const name = $('#nname').value.trim();
  if (!name) return toast('Give it a name first');
  try{
    const { data, error } = await sb.from('items').insert({
      name,
      layer: $('#nlayer').value,
      category_id: Number($('#ncat').value),
      item_class: $('#nclass').value,
      price_source: 'unknown',
      photo_source: 'none',
      source: 'app'
    }).select('id').single();
    if (error) throw error;
    $('#nname').value = '';
    $('#addsheet').classList.remove('show');
    await loadItems();
    state.picked.add(data.id);
    render();
    await freshness();
    toast('Added ' + name);
  }catch(e){ fail('add that item', e); }
};

/* ---------- go ------------------------------------------------- */
$('#worn').value = new Date(Date.now() - new Date().getTimezoneOffset()*60000)
  .toISOString().slice(0,10);
boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wardrobe">
<meta name="theme-color" content="#15171A">
<meta name="color-scheme" content="dark">
<title>Wardrobe</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   WARDROBE — phone-first rebuild (2026-09-30)
   Tokens from the approved canvas.
   ============================================================ */
:root{
  --ground:#15171A;
  --surface:#1E2125;
  --bar:#1A1C20;
  --line:#2C3036;
  --row:#24272C;
  --line-soft:#4A4F57;
  --text:#EEE7D7;
  --muted:#A19E95;
  --accent:#D6B36A;
  --on-accent:#15171A;
  --warn:#E09A64;
  --warn-line:#C9824E;
  --danger:#C4573A;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --nav-h:calc(58px + var(--sab));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html{background:var(--ground);overflow-x:hidden}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:var(--sans);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100vw;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
img{max-width:100%;display:block}
a{color:var(--accent);text-decoration:none}
[hidden]{display:none!important}

/* ---- type ---- */
.lbl{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lbl.accent{color:var(--accent)}
.lbl.warn{color:var(--warn)}
.datelbl{display:flex;align-items:center;gap:4px;min-height:44px}
.datelbl input{background:none;border:0;padding:0;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;-webkit-appearance:none;appearance:none;color-scheme:dark;min-height:44px;text-align:right}
.datelbl input::-webkit-calendar-picker-indicator{opacity:.6}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
h1{margin:0;font-size:30px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
h1.sm{font-size:28px}
h2{margin:0;font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.name{display:block;font-size:15px;line-height:1.3;overflow-wrap:anywhere;word-break:break-word}

/* ---- layout ---- */
#view{padding:calc(var(--sat) + 22px) 20px calc(var(--nav-h) + 24px)}
.stack{display:flex;flex-direction:column;gap:18px}
.stack.tight{gap:10px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.accent{border-color:var(--accent)}
.card.dashed{border-style:dashed;border-color:var(--line-soft)}

/* ---- buttons ---- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 16px;border-radius:8px;font-size:15px;font-weight:500;
  border:1px solid var(--line-soft);color:var(--text);background:transparent;
}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.big{min-height:56px;border-radius:10px;font-size:17px}
.btn.outline{border-color:var(--accent);color:var(--accent)}
.btn.dashed{border-style:dashed;border-color:var(--line-soft)}
.btn.warn{border-color:var(--warn-line);color:var(--warn)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45}
.btn:active{filter:brightness(1.1)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkbtn{color:var(--accent);font-size:15px;padding:10px 0 10px 12px;min-height:44px;display:inline-flex;align-items:center}

/* ---- segmented ---- */
.seg{display:grid;gap:6px}
.seg.c2{grid-template-columns:1fr 1fr}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg button{
  min-height:44px;border-radius:8px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.seg.soft button{min-height:40px;border-color:transparent;color:var(--muted)}
.seg.soft button[aria-pressed="true"]{background:var(--line);border-color:var(--line);color:var(--text);font-weight:600}

/* ---- inputs ---- */
.input{
  width:100%;height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font-size:16px;-webkit-appearance:none;appearance:none;
}
textarea.input{height:auto;min-height:88px;padding:10px 14px;line-height:1.4;resize:vertical}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none}

/* ---- item rows ---- */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--row);
  width:100%;min-height:52px;color:var(--text);
}
.row.tappable:active{background:rgba(255,255,255,.03)}
.sw{width:36px;height:36px;border-radius:6px;flex:0 0 auto;background:var(--line);overflow:hidden;position:relative}
.sw img{width:100%;height:100%;object-fit:cover}
.sw.lg{width:40px;height:40px}
.sw.sm{width:34px;height:34px}
.sw.dashed{background:transparent;border:1.5px dashed var(--warn-line)}
.rowmain{flex:1 1 auto;display:flex;flex-direction:column;gap:2px}
.rowend{flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.rowend.warn{color:var(--warn)}
.check{
  width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line-soft);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:700;font-size:16px;
}
.row[aria-checked="true"] .check{background:var(--accent);border-color:var(--accent)}
.row[aria-checked="true"] .check::after{content:'✓'}
.row.missing .name{color:var(--warn)}
.grouphead{padding:16px 0 4px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches .sw{width:36px;height:36px}

/* ---- month calendar ---- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal.dow span{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.08em}
.cal button{height:44px;border-radius:8px;background:var(--row);border:1px solid var(--row);font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.cal button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.cal button.today{border-color:var(--text);color:var(--text)}
.cal button.today.on{color:var(--on-accent);box-shadow:inset 0 0 0 2px var(--ground)}
.cal button.sel{border-color:var(--accent);color:var(--text)}
.cal button.sel.on{color:var(--on-accent);box-shadow:inset 0 0 0 2px var(--ground)}
.cal button.future{background:transparent;border-color:transparent;opacity:.4}
.calnav{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;line-height:1}
.calnav:disabled{opacity:.25}

/* ---- counters ---- */
.counters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.counters button{
  height:52px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.counters button b{font-size:16px;font-weight:600}
.counters button span{font-size:12px;color:var(--muted)}
.counters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.counters button[aria-pressed="true"] span{color:var(--on-accent)}

/* ---- nav ---- */
nav#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;height:var(--nav-h);
  background:var(--ground);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 20px var(--sab);
}
nav#nav a{display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);min-height:44px}
nav#nav a[aria-current="page"]{color:var(--accent);font-weight:600}

/* ---- sheets (picker, auth, edit) ---- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--ground);display:flex;flex-direction:column;overflow:hidden}
.sheet-head{padding:calc(var(--sat) + 14px) 20px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;flex:0 0 auto}
.sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 24px}
.sheet-foot{
  flex:0 0 auto;background:var(--bar);border-top:1px solid var(--line);
  padding:12px 20px calc(12px + var(--sab));display:flex;align-items:center;gap:12px;
}
.sheet-foot .tally{flex:1;font-size:15px}
.sheet-foot .tally b{font-weight:600}
.sheet-foot .btn.primary{min-height:50px;padding:0 28px;border-radius:10px;font-size:16px}
.photo-preview{display:flex;gap:12px;align-items:stretch}
.photo-preview img,.photo-preview .ph{width:104px;height:150px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--surface);border:1px dashed var(--line-soft)}

/* ---- item page ---- */
.carousel{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.carousel::-webkit-scrollbar{display:none}
.slide{width:300px;height:300px;flex:0 0 auto;scroll-snap-align:start;border-radius:12px;overflow:hidden;position:relative;background:var(--surface)}
.slide img{width:100%;height:100%;object-fit:cover}
.slide .badges{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.badge{padding:4px 8px;border-radius:4px;background:var(--ground);color:var(--text);font-family:var(--mono);font-size:10px;letter-spacing:.1em}
.badge.cover{color:var(--accent)}
.slide.plate{display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:rgba(0,0,0,.65);font-family:var(--mono);font-size:12px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line-soft)}
.dots i.on{background:var(--text)}
.looks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.looks::-webkit-scrollbar{display:none}
.look{width:84px;height:112px;flex:0 0 auto;border-radius:8px;overflow:hidden;background:var(--surface);border:1px solid var(--line);position:relative}
.look img{width:100%;height:100%;object-fit:cover}
.look span{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:10px;color:#fff;text-shadow:0 1px 2px #000}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;border-bottom:1px solid var(--row);width:100%}
.field .k{font-size:15px;color:var(--muted);flex:0 0 auto}
.field.gap .k{color:var(--warn)}
.field .v{font-size:15px;text-align:right;display:flex;align-items:center;gap:8px;justify-content:flex-end;overflow-wrap:anywhere}
.field .v .sw{width:18px;height:18px;border-radius:4px}
.field .v{flex:1 1 auto}
.field .chev{flex:0 0 auto;color:#A19E95;font-size:20px;line-height:1;padding-left:2px}
.field.notesrow{align-items:flex-start;padding:12px 0;border-bottom:0}
.field.notesrow .notes{flex:1 1 auto;text-align:left}
.editrow{display:flex;flex-direction:column;gap:10px;padding:10px 0 14px;border-bottom:1px solid var(--row)}
.editrow .actions{display:flex;gap:8px;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-soft);font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.notes{font-size:13px;color:var(--muted);line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---- progress ---- */
.bar{height:6px;border-radius:3px;background:var(--row);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ---- day chips ---- */
.daychips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.daychips::-webkit-scrollbar{display:none}
.daychips button{flex:0 0 auto;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.daychips button[aria-pressed="true"]{background:var(--line);color:var(--text)}
.daychips button.logged::after{content:'';display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--accent);margin-left:6px}

/* ---- add item ---- */
.sheet.top{z-index:50}
.capgrid{display:grid;grid-template-columns:3fr 2fr;gap:8px}
.capcol{display:flex;flex-direction:column;gap:8px}
.slot{border-radius:10px;border:1px dashed var(--line-soft);background:var(--surface);color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px;position:relative;overflow:hidden;min-height:118px}
.capgrid > .slot{aspect-ratio:3/4}
.capcol .slot{flex:1 1 0}
.slot .plus{font-size:26px;line-height:1;color:var(--accent)}
.slot .sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.slot.filled{border-style:solid;border-color:var(--line);padding:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;top:0;right:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:transparent;font-size:0}
.slot .x::before{content:'×';width:26px;height:26px;border-radius:13px;background:rgba(0,0,0,.62);color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.thumbs{display:flex;gap:8px}
.thumbs img{width:60px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.banner{border:1px solid var(--warn-line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(224,154,100,.07)}
.banner .bt{font-weight:600;color:var(--warn)}
.duprow{display:flex;align-items:center;gap:12px}
.rcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:44px}
.rcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rcard .rt{font-weight:600;font-size:15px}
.rcard .rp{font-family:var(--mono);font-size:13px;color:var(--text);flex:0 0 auto}
.frow{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.flabel{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ai{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:1px 5px;border-radius:4px;border:1px solid var(--line-soft);color:var(--accent)}
.frow.low .input,.frow.low .seg,.frow.low .chips{outline:1.5px solid var(--warn-line);outline-offset:2px;border-radius:8px}
.frow.need .flabel{color:var(--warn)}
.frow.need .input{border-color:var(--warn-line);border-style:dashed}
.seg.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c5 button{flex-direction:column;gap:1px;min-height:52px;padding:4px 2px;line-height:1.1}
.seg.c5 button b{font-size:15px;font-weight:600}
.seg.c5 button span{font-size:10px;text-align:center}

/* ---- messages ---- */
#fatal{position:fixed;left:0;right:0;top:0;z-index:100;background:var(--danger);color:#fff;padding:calc(var(--sat) + 14px) 20px 14px;font-size:14px;line-height:1.5}
#fatal .t{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px}
#err{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 12px);z-index:60;background:var(--danger);color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45;display:none;overflow-wrap:anywhere}
#err.show{display:block}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px);z-index:80;
  background:var(--text);color:var(--ground);font-size:14px;font-weight:500;padding:10px 16px;border-radius:8px;
  opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:calc(100vw - 40px);text-align:center;
}
#toast.show{opacity:1}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.empty{padding:20px 0;color:var(--muted);font-size:14px}
.hint{font-size:14px;color:var(--muted);line-height:1.4}
.warnrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.warnrow .txt{font-size:15px;color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<!-- ============================================================
     CONFIG. The publishable key is safe in a public repo:
     RLS grants access only to authenticated sessions.
     ============================================================ -->
<script>
  window.WARDROBE_CONFIG = {
    url: 'https://sobshyactzxhtsayemkj.supabase.co',
    key: 'sb_publishable_bEjEjiIRdyYKxynJmw_OiQ_NU-8h4Gq'
  };
  // Boot watchdog: a failed ESM import kills a module silently, so a
  // classic script owns the "did the app start?" question.
  window.__wardrobe = { booted:false };
  window.showFatal = function(title, msg){
    var b = document.getElementById('fatal');
    if (!b) return;
    b.querySelector('.t').textContent = title;
    b.querySelector('.m').textContent = msg || '';
    b.hidden = false;
  };
  window.addEventListener('error', function(e){ if (!window.__wardrobe.booted) window.showFatal('The app failed to start', e.message || String(e.error||e)); });
  window.addEventListener('unhandledrejection', function(e){ var r=e.reason; window.showFatal(window.__wardrobe.booted ? 'Something went wrong' : 'The app failed to start', (r && r.message) || String(r)); });
  setTimeout(function(){ if (!window.__wardrobe.booted) window.showFatal('The app code did not load', 'Could not reach esm.sh for supabase-js within 12 s. Check the connection and reload.'); }, 12000);
</script>

<div id="fatal" role="alert" hidden><span class="t"></span><span class="m"></span></div>
<main id="view"><div class="loading">Loading</div></main>
<nav id="nav" aria-label="Sections">

  <a href="#/trip" data-tab="trip">Trip</a>
  <a href="#/closet" data-tab="closet">Closet</a>
</nav>
<div id="layer"></div>
<div id="layer2"></div>
<div id="err" role="alert"></div>
<div id="toast" role="status"></div>
<input type="file" id="filepick" accept="image/*" hidden>

<script type="module">
/* ------------------------------------------------------------
   One init path: main() → client → session → start() → render.
   ------------------------------------------------------------ */
const CFG = window.WARDROBE_CONFIG;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let createClient;
try {
  ({ createClient } = await import('https://esm.sh/@supabase/supabase-js@2'));

/* The day rolls over at DAY_ROLLOVER local time, not midnight: anything logged
   or viewed before it belongs to the previous calendar day. Phone-local time,
   so it follows Joe to Athens. Every "today" in the app comes from todayISO(). */
const DAY_ROLLOVER = '03:33';
function now(){ return new Date(); }
function todayISO(){
  const [h, m] = DAY_ROLLOVER.split(':').map(Number);
  const d = now(); d.setMinutes(d.getMinutes() - (h*60 + m));
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(iso, n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function daysBetween(a, b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtLabel(iso){ const d=parseISO(iso); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`.toUpperCase(); }
function fmtLong(iso){ const d=parseISO(iso); return `${WDL[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`; }
function fmtShort(iso){ const d=parseISO(iso); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`; }
function relDay(iso){ const t=todayISO(); if (iso===t) return 'today'; if (iso===addDays(t,-1)) return 'yesterday'; return fmtShort(iso); }
const SLOT = { primary:'Day', evening:'Evening', gym:'Gym', bed:'Bed', travel:'Travel' };
const PICK_SLOTS = ['primary','evening','gym','travel'];
const FORMALITY = {1:'lounge',2:'casual',3:'smart casual',4:'cocktail',5:'suit & tie'};
const LOCATIONS = ['Coat rack','Shoe rack','Basket','Dresser','Closet','Cedar chest','Bureau','Storage unit'];

/* Alphabetical lists sort on a key that drops leading quotes/punctuation and case,

const sortKey = s => String(s ?? '').replace(/^[^\p{L}\p{N}]+/u, '').toLowerCase();

/* ---- categories / groups ---- */
/* Groups shown in Closet, the picker and Pack. Membership is derived from
   categories.parent_id at load time: each top-level category belongs to the
   group that names it here; a top-level category nobody names becomes its own
   group (label = its name) instead of falling into Other. This list only
   fixes the display order and the labels. */
const GROUP_DEFS = [
  { key:'coats',   label:'Coats & Outerwear',    parents:['Outerwear','Tailoring'] },
  { key:'shirts',  label:'Shirts & Tops',        parents:['Tops'] },
  { key:'jackets', label:'Jackets & Overshirts', parents:['Jackets & Overshirts'] },
  { key:'knit',    label:'Knitwear',             parents:['Knitwear'] },
  { key:'pants',   label:'Pants',                parents:['Bottoms'] },
  { key:'shoes',   label:'Shoes',                parents:['Shoes'] },
  { key:'acc',     label:'Accessories',          parents:['Accessories'] },
  { key:'other',   label:'Other',                parents:['Collection','Property'] },
];
const LAYER_SPLIT = new Set(['Activewear']);   // children file under Shirts or Pants by their layer
const LAYER_GROUP = { outer:'coats', shirt:'shirts', pants:'pants', shoes:'shoes', accessory:'acc' };
function buildGroups(){
  const byName = new Map(); for (const g of GROUP_DEFS) for (const n of g.parents) byName.set(n, g.key);
  state.groupByParent = new Map();
  const extra = [];
  for (const c of state.cats.filter(c => !c.parent_id).sort((x,y) => (x.sort_order||0) - (y.sort_order||0))){
    if (LAYER_SPLIT.has(c.name)) continue;
    let key = byName.get(c.name);
    if (!key){ key = 'p' + c.id; extra.push([key, c.name]); }
    state.groupByParent.set(c.id, key);
  }
  const known = GROUP_DEFS.map(g => [g.key, g.label]);
  state.groupOrder = [...known.filter(([k]) => k !== 'other'), ...extra, ...known.filter(([k]) => k === 'other')];
}
function catOf(it){ return state.catById.get(it.category_id); }
function parentCat(it){ const c=catOf(it); if (!c) return null; return c.parent_id ? state.catById.get(c.parent_id) : c; }
function layerOf(it){ return it.layer || catOf(it)?.default_layer || 'other'; }
function groupOf(it){
  const p = parentCat(it);
  if (p && !LAYER_SPLIT.has(p.name)){ const k = state.groupByParent.get(p.id); if (k) return k; }
  return LAYER_GROUP[(p && catOf(it)?.default_layer) || layerOf(it)] || 'other';
}
function grouped(items){
  const m = new Map(state.groupOrder.map(([k])=>[k,[]]));
  for (const it of items) m.get(groupOf(it)).push(it);
  return state.groupOrder.filter(([k])=>m.get(k).length).map(([k,label])=>({key:k,label,items:m.get(k).sort(byName)}));
}

}

function missingLayers(itemIds){
  const its = itemIds.map(id=>state.itemById.get(id)).filter(Boolean);

  const hasTop = has('shirt') || its.some(i => groupOf(i)==='knit');

function planAllowed(it, occ){
  if (it.location === 'Storage unit') return false;
  if (occ?.excluded_category_ids?.length && it.category_id && occ.excluded_category_ids.map(Number).includes(Number(it.category_id))) return false;
  if (occ?.formality_min != null && it.formality != null && it.formality < occ.formality_min - 1) return false;

function anchorWarning(itemIds, occ){

  const anchors = its.filter(i => ['coats','jackets','pants','shoes'].includes(groupOf(i)));

async function fetchOutfit(date, slot){

/* Save = replace the outfit's item list. Never called with an empty list. */
async function saveOutfit({date, slot, itemIds, tripId, photoPath}){
  if (!itemIds.length) throw new Error('nothing selected');
  const existing = await fetchOutfit(date, slot);
  let id;
  if (existing){
    id = existing.id;
    const patch = {};
    if (tripId && !existing.trip_id) patch.trip_id = tripId;
    if (photoPath) patch.photo_ref = photoPath;
    if (Object.keys(patch).length){ const { error } = await sb.from('outfits').update(patch).eq('id', id); if (error) throw error; }
  } else {
    const row = { worn_on:date, slot, source:'app' };
    if (tripId) row.trip_id = tripId;
    if (photoPath) row.photo_ref = photoPath;
    const { data, error } = await sb.from('outfits').insert(row).select('id').single();
    if (error) throw error; id = data.id;
  }
  const del = await sb.from('outfit_items').delete().eq('outfit_id', id); if (del.error) throw del.error;
  const ins = await sb.from('outfit_items').insert(itemIds.map(item_id => ({outfit_id:id, item_id}))); if (ins.error) throw ins.error;
  await reloadOutfits();
  return id;
}

  if (itemIds.length){ const ins = await sb.from('occasion_items').insert(itemIds.map(item_id => ({occasion_id:occasionId, item_id}))); if (ins.error) throw ins.error; }
  await reloadTrips();
}

  if (error) throw error;
  const files = (data||[]).filter(f => f.name.startsWith(prefix) && !f.name.endsWith('/')).map(f => f.name);
  // legacy cover not matching the prefix (e.g. bucket-prefixed photo_ref) still counts if it exists

    if (probe && probe.some(f=>f.name===cover)) files.unshift(cover);
  }
  return files;
}

/* ------------------------------------------------------------

   ------------------------------------------------------------ */
function loadImageEl(src, cors){
  return new Promise((res, rej) => { const im = new Image(); if (cors) im.crossOrigin = 'anonymous'; im.onload = ()=>res(im); im.onerror = ()=>rej(new Error('image failed to load')); im.src = src; });
}
async function processFile(file, maxSide=1600){
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImageEl(url);
    const scale = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.max(1, Math.round(im.naturalWidth*scale)), h = Math.max(1, Math.round(im.naturalHeight*scale));
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (!blob) throw new Error('could not encode image');
    return { blob, hex: dominantHex(im) };
  } finally { URL.revokeObjectURL(url); }
}
/* Dominant colour of the item. Background-aware: if the four corners agree,
   that colour is treated as the backdrop and ignored; otherwise near-white and
   near-black pixels are ignored. Falls back to a plain average when everything
   was filtered out (e.g. a white shirt on white, or a close-up that fills the frame). */
function dominantHex(im){
  const N = 64, c = document.createElement('canvas'); c.width=N; c.height=N;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(im, 0, 0, N, N);
  const px = ctx.getImageData(0,0,N,N).data;
  const dist = (r,g,b,q) => Math.hypot(r-q[0], g-q[1], b-q[2]);
  const K = 6, corners = [[0,0],[N-K,0],[0,N-K],[N-K,N-K]].map(([cx,cy]) => {
    let r=0,g=0,b=0,n=0;
    for (let y=cy; y<cy+K; y++) for (let x=cx; x<cx+K; x++){ const i=(y*N+x)*4; if (px[i+3]<128) continue; r+=px[i]; g+=px[i+1]; b+=px[i+2]; n++; }
    return n ? [r/n, g/n, b/n] : null;
  }).filter(Boolean);
  let bg = null;
  if (corners.length >= 3){
    const mean = [0,1,2].map(i => corners.reduce((s,q)=>s+q[i],0) / corners.length);
    if (corners.every(q => dist(q[0],q[1],q[2],mean) < 28)) bg = mean;
  }
  const lo = Math.round(N*0.15), hi = Math.round(N*0.85);
  const buckets = new Map(); let fr=0,fg=0,fb=0,fn=0;
  for (let y=lo; y<hi; y++) for (let x=lo; x<hi; x++){
    const i=(y*N+x)*4, r=px[i], g=px[i+1], b=px[i+2]; if (px[i+3]<128) continue;
    fr+=r; fg+=g; fb+=b; fn++;
    if (bg){ if (dist(r,g,b,bg) < 42) continue; }
    else { const mx=Math.max(r,g,b), mn=Math.min(r,g,b); if ((mx>238 && mn>222) || mx<30) continue; }
    const key = ((r>>4)<<8)|((g>>4)<<4)|(b>>4);
    const k = buckets.get(key) || {r:0,g:0,b:0,n:0}; k.r+=r;k.g+=g;k.b+=b;k.n++; buckets.set(key,k);
  }
  let best=null; for (const k of buckets.values()) if (!best || k.n>best.n) best=k;
  if (!best || best.n < 12){ if (!fn) return null; best={r:fr,g:fg,b:fb,n:fn}; }
  const hx = v => pad(Math.round(v).toString(16).toUpperCase(),2);
  return '#' + hx(best.r/best.n) + hx(best.g/best.n) + hx(best.b/best.n);
}

    switch (seg[0]){
      case 'today': setNav('today'); view.innerHTML = dayHTML(todayISO()); bindDay(todayISO()); break;
      case 'day': setNav('today'); view.innerHTML = dayHTML(seg[1]||todayISO()); bindDay(seg[1]||todayISO()); break;

      case 'closet': setNav('closet'); view.innerHTML = closetHTML(); bindCloset(); break;
      case 'item': setNav('closet'); renderItem(Number(seg[1])); break;
      default: go('#/today');
    }
  } catch (e) { fail('draw this screen', e); }
}

/* ------------------------------------------------------------
   TODAY / a day
   ------------------------------------------------------------ */
function dayHTML(date){
  const isToday = date === todayISO();
  const logged = outfitsOn(date);
  const parts = [];
  parts.push(`<div class="stack tight"><div class="lbl">${isToday ? 'TODAY · ' : ''}${fmtLabel(date)}</div>`);
  if (!logged.length){
    parts.push(`<h1>Not logged${isToday?' yet':''}</h1></div>`);
    parts.push(`<button class="btn primary big" id="logbtn">Log what I'm wearing</button>`);
    parts.push(`<button class="btn" id="selfiebtn">Log from a selfie</button>`);
    const prev = state.outfits.find(o => o.slot==='primary' && o.worn_on < date && o.items.length);
    if (prev){
      const its = prev.items.map(id=>state.itemById.get(id)).filter(Boolean);
      const names = its.slice(0,5).map(i=>shortName(i)).join(', ') + (its.length>5 ? `, +${its.length-5}` : '');
      const when = prev.worn_on===addDays(date,-1) ? 'yesterday' : relDay(prev.worn_on);
      parts.push(`<div class="card">
        <div class="between"><div style="font-weight:500">Same as ${esc(when)}?</div><div class="mono">${esc(fmtLabel(prev.worn_on).split(' ')[0])} · ${its.length} ITEMS</div></div>
        <div class="swatches">${its.map(i=>swatchHTML(i)).join('')}</div>
        <div class="small muted">${esc(names)}</div>
        <button class="btn outline" id="wearagain" data-outfit="${prev.id}">Wear again</button>
      </div>`);
    }
  } else {
    parts.push(`<div class="between"><h1>Logged · ${logged.length} outfit${logged.length===1?'':'s'}</h1></div></div>`);
    for (const o of logged){
      const its = o.items.map(id=>state.itemById.get(id)).filter(Boolean);
      const photo = o.photo_ref ? publicUrl(o.photo_ref) : null;
      parts.push(`<section class="stack tight">
        <div class="between"><span class="lbl ${o.slot==='primary'?'':'accent'}">${esc(SLOT[o.slot]||o.slot)} · ${its.length}${o.trip_id?' · TRIP':''}</span><button class="linkbtn" data-edit="${o.id}" data-date="${o.worn_on}" data-slot="${o.slot}">Edit</button></div>
        ${photo ? `<a href="${esc(photo)}" target="_blank" rel="noopener" style="display:flex;gap:12px;align-items:center;color:inherit"><img src="${esc(photo)}" alt="Outfit photo" style="width:96px;height:128px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><span class="small muted">Outfit photo. It shows in the Looks strip of each item.</span></a>` : ''}
        <div class="rows">${its.map(i=>itemRowHTML(i,{href:`#/item/${i.id}`})).join('')}</div>
      </section>`);
    }
    const next = PICK_SLOTS.find(s => !logged.some(o=>o.slot===s) && s!=='primary') || null;
    if (next) parts.push(`<button class="btn dashed" id="addslot" data-slot="${next}">+ Add ${next==='evening'?'an evening':'a '+next} outfit</button>`);
  }
  parts.push(calendarHTML(date));
  if (!isToday) parts.push(`<a class="linkbtn" href="#/today" style="padding-left:0">‹ Back to today</a>`);
  return `<div class="stack">${parts.join('')}</div>`;
}
/* Month calendar: logged days filled, today outlined, tap a day to open it. */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function calendarHTML(date){
  const t = todayISO();
  if (state.calFor !== date){ state.calFor = date; state.calMonth = date.slice(0,7); }
  const [y, m] = state.calMonth.split('-').map(Number);
  const nDays = new Date(y, m, 0).getDate(), lead = new Date(y, m-1, 1).getDay();
  let cells = '<i></i>'.repeat(lead), n = 0;
  for (let d=1; d<=nDays; d++){
    const iso = `${y}-${pad(m)}-${pad(d)}`, on = outfitsOn(iso).length > 0, future = iso > t;
    if (on) n++;
    const cls = [on?'on':'', iso===t?'today':'', iso===date && iso!==t ? 'sel':'', future && !on ? 'future':''].filter(Boolean).join(' ');
    cells += `<button type="button" data-day="${iso}" class="${cls}" ${future && !on ? 'disabled':''} aria-label="${esc(fmtShort(iso))}${on?', logged':''}">${d}</button>`;
  }
  const atCurrent = state.calMonth >= t.slice(0,7);
  return `<div class="stack tight" id="cal" style="gap:8px">
    <div class="between" style="align-items:center">
      <div style="display:flex;align-items:center;gap:2px;margin-left:-14px"><button type="button" class="calnav" id="cal-prev" aria-label="Previous month">‹</button><span class="lbl">${MONTHS[m-1]} ${y}</span><button type="button" class="calnav" id="cal-next" aria-label="Next month" ${atCurrent?'disabled':''}>›</button></div>
      <span class="mono">${n} LOGGED</span>
    </div>
    <div class="cal dow">${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal">${cells}</div>
  </div>`;
}
function bindCalendar(date){
  $$('#cal .cal button[data-day]').forEach(b => b.addEventListener('click', ()=>go(b.dataset.day===todayISO()?'#/today':`#/day/${b.dataset.day}`)));
  const shift = n => { const [y,m] = state.calMonth.split('-').map(Number); const d = new Date(y, m-1+n, 1); state.calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; $('#cal').outerHTML = calendarHTML(date); bindCalendar(date); };
  $('#cal-prev')?.addEventListener('click', ()=>shift(-1));
  $('#cal-next')?.addEventListener('click', ()=>shift(1));
}
function shortName(it){ return String(it.name).split(/\s[—–]\s/)[0]; }
function bindDay(date){
  $('#logbtn')?.addEventListener('click', ()=>openPicker({date, slot:'primary'}));
  $('#selfiebtn')?.addEventListener('click', ()=>logFromSelfie(date));
  $('#addslot')?.addEventListener('click', e=>openPicker({date, slot:e.currentTarget.dataset.slot}));
  $$('[data-edit]').forEach(b => b.addEventListener('click', ()=>openPicker({date:b.dataset.date, slot:b.dataset.slot})));
  bindCalendar(date);
  $('#wearagain')?.addEventListener('click', async e => {
    const btn=e.currentTarget; const prev = state.outfits.find(o=>o.id===Number(btn.dataset.outfit)); if (!prev) return;
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await saveOutfit({date, slot:'primary', itemIds:prev.items, tripId:tripForDate(date)?.id});
      toast(`Logged ${prev.items.length} items`); render();
    } catch(err){ fail('save the outfit', err); btn.disabled=false; btn.textContent='Wear again'; }
  });
}
async function logFromSelfie(date){
  const file = await pickFile(); if (!file) return;
  toast('Preparing photo…');
  try {
    const { blob } = await processFile(file, 1600);
    const url = URL.createObjectURL(blob);
    const sugg = await suggestItemsFromPhoto(blob, state.items);

/* ------------------------------------------------------------
   PICKER (log an outfit / plan an occasion)
   ------------------------------------------------------------ */
let picker = null;
async function openPicker(opts){
  // opts: {date, slot, mode:'outfit'|'plan', occasion, trip, prefill:[ids], photo, suggested, saveLabel}
  picker = {
    mode: opts.mode || 'outfit', date: opts.date, slot: opts.slot || 'primary',
    occasion: opts.occasion || null, trip: opts.trip || null,
    picked: new Set(opts.prefill || []), photo: opts.photo || null, suggested: opts.suggested || null,
    query:'', showAll:false, saveLabel: opts.saveLabel || 'Save', existing:null, loading:true, prefilled: !!opts.prefill,
  };
  drawPicker();
  await loadPickerExisting();
}
async function loadPickerExisting(){
  if (picker.mode !== 'outfit'){ picker.loading=false; drawPicker(); return; }
  try {
    const ex = await fetchOutfit(picker.date, picker.slot);
    if (!picker) return;
    picker.existing = ex;
    if (!picker.prefilled){
      if (ex) picker.picked = new Set(ex.items);
      else if (picker.suggested?.visible?.length) picker.picked = new Set(picker.suggested.visible);
      else picker.picked = new Set();
    }
  } catch(e){ fail('load the existing outfit', e); }
  picker.loading = false; drawPicker();
}
function closePicker(){ if (picker?.photo?.url) URL.revokeObjectURL(picker.photo.url); picker=null; $('#layer').innerHTML=''; }

function pickerItems(){
  let list = state.items.slice();
  if (picker.mode==='plan' && !picker.showAll) list = list.filter(it => planAllowed(it, picker.occasion) || picker.picked.has(it.id));
  const q = picker.query.trim().toLowerCase();
  if (q) list = list.filter(it => [it.name, it.brand, it.notes].some(s => s && String(s).toLowerCase().includes(q)));
  return list;
}
function drawPicker(){
  if (!picker) return;
  const p = picker;
  const list = pickerItems();
  const recent = list.filter(it => wearOf(it.id).n).sort((a,b)=>{ const A=wearOf(a.id),B=wearOf(b.id); return (B.last||'').localeCompare(A.last||'') || B.n-A.n; }).slice(0,12);
  const recentIds = new Set(recent.map(i=>i.id));
  const rest = grouped(list.filter(i=>!recentIds.has(i.id)));
  const hiddenCount = p.mode==='plan' && !p.showAll ? state.items.filter(it => !planAllowed(it, p.occasion) && !p.picked.has(it.id)).length : 0;
  const isPlan = p.mode==='plan';
  const title = isPlan ? `PLAN · ${esc(fmtLabel(p.date))} · ${esc((SLOT[p.slot]||p.slot).toUpperCase())}` : `${esc(fmtLabel(p.date))}${p.trip?' · '+esc(tripShort(p.trip)):''}`;
  const sugg = p.suggested;
  const suggVisible = sugg?.visible?.map(id=>state.itemById.get(id)).filter(Boolean) || [];
  const suggPossible = sugg?.possible?.map(s=>({it:state.itemById.get(s.id), why:s.reason})).filter(s=>s.it) || [];
  const shownIds = new Set([...suggVisible.map(i=>i.id), ...suggPossible.map(s=>s.it.id)]);

  const rowsHTML = (its) => its.map(it => itemRowHTML(it, {check:p.picked.has(it.id)})).join('');
  const warn = isPlan ? anchorWarning([...p.picked], p.occasion) : '';

  $('#layer').innerHTML = `<div class="sheet" role="dialog" aria-label="${isPlan?'Plan this outfit':'Log an outfit'}">
    <div class="sheet-head">
      <div class="between" style="align-items:center">
        <button class="linkbtn" id="pk-cancel" style="padding-left:0">Cancel</button>
        ${isPlan ? `<span class="lbl">${title}</span>` : `<label class="lbl datelbl">${p.trip?esc(tripShort(p.trip))+' · ':''}<input type="date" id="pk-date" value="${esc(p.date)}" aria-label="Date"></label>`}
      </div>
      ${isPlan ? `<div><div style="font-weight:600">${esc(p.occasion?.name||'')}</div>${p.occasion?.dress_code?`<div class="small muted">${esc(p.occasion.dress_code)}${p.occasion.formality_min?` · formality ${p.occasion.formality_min}${p.occasion.formality_max&&p.occasion.formality_max!==p.occasion.formality_min?'–'+p.occasion.formality_max:''}`:''}</div>`:''}</div>`
      : `<div class="seg c4" role="radiogroup" aria-label="Slot">${PICK_SLOTS.map(s=>`<button type="button" data-slot="${s}" aria-pressed="${p.slot===s}">${SLOT[s]}</button>`).join('')}</div>`}
      ${p.photo ? `<div class="photo-preview"><img src="${esc(p.photo.url)}" alt="Your selfie"><div style="display:flex;flex-direction:column;justify-content:center;gap:6px"><div style="font-size:18px;font-weight:600;line-height:1.2">${suggVisible.length?"Here's what I can see":'Photo attached'}</div><div class="hint">${suggVisible.length?"Untick anything wrong. Tick the maybes you're wearing.":'Pick what you\'re wearing. Automatic recognition isn\'t set up yet.'}</div></div></div>` : ''}

    </div>
    <div class="sheet-body" id="pk-body">
      ${p.loading ? '<div class="loading">Loading</div>' : ''}
      ${suggVisible.length ? `<div class="lbl grouphead">Clearly visible</div><div class="rows">${rowsHTML(suggVisible)}</div>` : ''}
      ${suggPossible.length ? `<div class="lbl grouphead">Possible · partly hidden</div><div class="rows">${suggPossible.map(s=>itemRowHTML(s.it,{check:p.picked.has(s.it.id), end:{text:s.why}})).join('')}</div>` : ''}
      ${recent.length ? `<div class="lbl grouphead">Worn lately</div><div class="rows">${rowsHTML(recent.filter(i=>!shownIds.has(i.id)))}</div>` : ''}
      ${rest.map(g=>`<div class="lbl grouphead">${esc(g.label)} · ${g.items.length}</div><div class="rows">${rowsHTML(g.items.filter(i=>!shownIds.has(i.id)))}</div>`).join('')}
      ${!list.length && !p.loading ? `<div class="empty">Nothing matches${p.query.trim()?` “${esc(p.query.trim())}”`:''}.</div><button type="button" class="btn outline" id="pk-additem">+ Add item</button>` : ''}

  // bind
  $('#pk-cancel').onclick = closePicker;
  const q = $('#pk-q');
  q.oninput = () => { const pos=q.selectionStart; p.query = q.value; drawPickerBody(); };
  const dateInp = $('#pk-date');
  if (dateInp) dateInp.onchange = async () => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateInp.value) || dateInp.value===p.date) return;
    p.date = dateInp.value; p.prefilled=false; p.loading=true; drawPicker(); await loadPickerExisting();
  };
  $$('#layer .seg button').forEach(b => b.onclick = async () => { if (p.slot===b.dataset.slot) return; p.slot=b.dataset.slot; p.prefilled=false; p.loading=true; drawPicker(); await loadPickerExisting(); });

function drawPickerBody(){ // re-render only the list, keep the search box focused
  const scroll = $('#pk-body')?.scrollTop || 0;

async function savePicker(){

function tripHTML(){

function daysHTML(tr){

function packHTML(tr){

    ${missing.length ? `<div class="stack tight" style="gap:4px"><div class="lbl warn">Missing</div>${missing.map(m=>`<div class="warnrow"><span class="sw sm dashed"></span><span class="txt">${esc(m)}</span></div>`).join('')}</div>` : ''}

const GAPS = {

  const f = state.closetFilter;
  let body = '';

function editRowHTML(it, k, label){

function bindItem(it){

/* ------------------------------------------------------------
   ADD ITEM: photo(s) → identify-item (returns a draft, writes nothing)
   → review form → save. Nothing is saved until Joe taps Save.
   ------------------------------------------------------------ */
const IDENTIFY_URL = CFG.url + '/functions/v1/identify-item';
const FORMALITY_SHORT = {1:'lounge',2:'casual',3:'smart casual',4:'cocktail',5:'suit'};
const money = v => { const n = Number(v); return '$' + (Number.isInteger(n) ? n : n.toFixed(2)); };
const nz = v => { const s = String(v ?? '').trim(); return s === '' ? null : s; };
let adder = null;

function openAdder(opts={}){
  adder = { step:'capture', item:null, labels:[], draft:null, receipts:[], duplicates:[], dupDismissed:false,
            receiptId:null, form:null, ai:{}, error:null, abort:null, timer:null, busy:false, saved:null,
            fromPicker:!!opts.fromPicker, hintName:opts.hintName||'' };
  drawAdder();
  window.visualViewport?.addEventListener('resize', fitAdder);
  window.visualViewport?.addEventListener('scroll', fitAdder);
}
function closeAdder(){
  if (!adder) return;
  adder.abort?.abort(); clearInterval(adder.timer);
  for (const p of [adder.item, ...adder.labels]) if (p?.url) URL.revokeObjectURL(p.url);
  adder = null; $('#layer2').innerHTML = '';
  window.visualViewport?.removeEventListener('resize', fitAdder);
  window.visualViewport?.removeEventListener('scroll', fitAdder);
}
/* Keep the sheet, and its Save bar, inside the visible viewport while the keyboard is up. */
function fitAdder(){
  const s = $('#layer2 .sheet'), vv = window.visualViewport; if (!s || !vv) return;
  s.style.height = vv.height + 'px'; s.style.top = vv.offsetTop + 'px'; s.style.bottom = 'auto';
}
function blobToB64(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error || new Error('could not read the image')); r.readAsDataURL(blob); });
}
function initAdderForm(resp){
  const a = adder, d = resp?.draft || null;
  a.draft = d; a.receipts = resp?.receipts || []; a.duplicates = resp?.duplicates || []; a.dupDismissed = false; a.receiptId = null; a.ai = {};
  const cat = d && state.catById.has(Number(d.category_id)) ? Number(d.category_id) : '';
  const team = d && state.teams.some(t => t.id === Number(d.team_id)) ? Number(d.team_id) : '';
  const notes = d ? [d.description, d.style_code ? `Style code: ${d.style_code}` : null].filter(Boolean).join('\n') : '';
  a.form = {
    name: d?.name || a.hintName || '', brand: d?.brand || '', colour: d?.colour_name || '', category_id: cat,
    size: d?.size || '', material: d?.material || '', team_id: team,
    formality: d && d.formality >= 1 && d.formality <= 5 ? Number(d.formality) : null,
    weight: d && ['light','mid','heavy'].includes(d.weight) ? d.weight : null,
    season_tags: d ? (d.season_tags || []).map(s => String(s).toLowerCase()).filter(s => SEASONS.includes(s)) : [],
    unit_price:'', purchase_date:'', retailer:'', location:'', notes,
  };
  if (d){
    // only fields Claude actually filled get a marker; nulls stay empty for Joe
    const conf = d.confidence || {};
    const src = { name:'name', brand:'brand', colour:'colour_name', category_id:'category_id', size:'size', material:'material', team_id:'team_id', formality:'formality', weight:'weight', season_tags:'season_tags', notes:'description' };
    for (const [k, dk] of Object.entries(src)){
      const v = a.form[k]; const filled = Array.isArray(v) ? v.length > 0 : (v !== '' && v != null);
      if (filled) a.ai[k] = conf[dk] || (k === 'colour' ? conf.colors : null) || 'medium';
    }
  }
}
async function identifyAdder(){
  const a = adder; if (!a?.item) return;
  a.step = 'loading'; a.error = null; a.abort = new AbortController(); a.t0 = Date.now(); drawAdder();
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('not signed in');
    const images = [];
    for (const p of [a.item, ...a.labels]) images.push({ media_type:'image/jpeg', data: await blobToB64(p.blob) });
    const r = await fetch(IDENTIFY_URL, { method:'POST', signal:a.abort.signal,
      headers:{ 'Content-Type':'application/json', apikey:CFG.key, Authorization:`Bearer ${session.access_token}` },
      body: JSON.stringify({ images }) });
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error(j?.error || `identify failed (HTTP ${r.status})`);
    if (adder !== a) return;
    initAdderForm(j);
  } catch (e) {
    if (adder !== a) return;
    clearInterval(a.timer);
    if (e.name === 'AbortError'){ a.step = 'capture'; drawAdder(); return; }
    initAdderForm(null);
    a.error = e instanceof TypeError ? `Could not reach the identify service (${e.message}). Check the connection.` : ((e && e.message) || String(e));
  }
  clearInterval(a.timer); a.step = 'form'; drawAdder();
}
async function takeAdderPhoto(slot, camera){
  const file = await pickFile(camera); if (!file || !adder) return;
  try {
    const p = await processFile(file, 1600);
    const o = { blob:p.blob, hex:p.hex, url:URL.createObjectURL(p.blob) };
    if (slot === 'item'){ if (adder.item?.url) URL.revokeObjectURL(adder.item.url); adder.item = o; }
    else if (adder.labels.length < 2) adder.labels.push(o);
    drawAdder();
  } catch (e) { fail('read that photo', e); }
}
function readAdderForm(){
  const f = adder?.form; if (!f) return;
  for (const k of ['name','brand','colour','category_id','size','material','team_id','unit_price','purchase_date','retailer','location','notes']){
    const el = $('#af-' + k); if (el) f[k] = el.value;
  }
}
const ADDER_NEED = ['size','unit_price','location'];

function adderFormHTML(){
  const a = adder, f = a.form;
  const ai = k => a.ai[k] ? '<span class="ai">AI</span>' : '';
  const need = k => ADDER_NEED.includes(k) && !String(f[k] ?? '').trim();
  const row = (k, label, inner) => `<div class="frow ${a.ai[k]==='low'?'low':''} ${need(k)?'need':''}" data-k="${k}"><label class="flabel" for="af-${k}">${esc(label)}${ai(k)}</label>${inner}</div>`;
  const text = (k, ph='', attrs='') => `<input class="input" id="af-${k}" type="text" value="${esc(f[k] ?? '')}" placeholder="${esc(ph)}" autocomplete="off" ${attrs}>`;
  const parents = state.cats.filter(c => !c.parent_id);
  const blocked = a.duplicates.length && !a.dupDismissed;

  const thumbs = `<div class="thumbs">${[a.item, ...a.labels].map((p,i)=>`<img src="${esc(p.url)}" alt="${i?'Label':'Item'} photo">`).join('')}</div>`;
  const errBanner = a.error ? `<div class="banner"><div class="bt">Couldn't read the photo</div><div class="small">${esc(a.error)}</div><div class="small muted">Fill it in by hand. Your photo is kept and saving still works.</div></div>` : '';
  const dupBanner = blocked ? `<div class="banner" id="ad-dups"><div class="bt">Possibly already in your closet</div>
    ${a.duplicates.map(d => { const it = state.itemById.get(d.id); return `<div class="duprow">${it ? swatchHTML(it) : '<span class="sw"></span>'}<span class="rowmain"><span class="name">${esc(d.name)}</span><span class="brand">${esc([d.brand, d.size].filter(Boolean).join(' · '))}</span></span></div>
      <div class="btn-row"><button type="button" class="btn small" data-dup-open="${d.id}">Open it</button><button type="button" class="btn small" data-dup-photo="${d.id}">Add this photo to it</button></div>`; }).join('')}
    <button type="button" class="btn warn" id="ad-dup-dismiss">Create new anyway</button></div>` : '';
  const receipts = a.receipts.length ? `<div class="stack tight" style="gap:8px"><div class="lbl">Receipt match</div>
    ${a.receipts.map(r => `<button type="button" class="rcard" data-receipt="${r.id}" aria-pressed="${a.receiptId===r.id}">
      <span class="between"><span class="rt">${esc(r.retailer || 'Receipt')}</span><span class="rp">${r.unit_price != null ? money(r.unit_price) : ''}</span></span>
      <span class="name">${esc(r.item_description || '')}</span>
      <span class="brand">${r.order_date ? esc(fmtShort(r.order_date) + ' ' + r.order_date.slice(0,4)) : 'no date'}${r.strong_hit ? ' · brand or style match' : ''}</span></button>`).join('')}
    <button type="button" class="btn small" id="ad-receipt-none" ${a.receiptId ? '' : 'disabled'}>None of these</button></div>` : '';

  const fields = [
    row('name', 'Name', text('name', 'Product name — colour')),
    row('brand', 'Brand', text('brand')),
    row('colour', 'Colour', text('colour')),
    row('category_id', 'Category', `<select class="input" id="af-category_id"><option value="">Choose…</option>${parents.map(p => `<optgroup label="${esc(p.name)}">${state.cats.filter(c => c.parent_id === p.id).map(c => `<option value="${c.id}" ${Number(f.category_id)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('')}</select>`),
    row('size', 'Size', text('size', 'e.g. M, 32x30, US 12', 'autocapitalize="characters"')),
    row('material', 'Material', text('material')),
    row('team_id', 'Team / band', `<select class="input" id="af-team_id"><option value="">None</option>${state.teams.map(t => `<option value="${t.id}" ${Number(f.team_id)===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`),
    row('formality', 'Formality', `<div class="seg c5" id="af-formality">${[1,2,3,4,5].map(n => `<button type="button" data-v="${n}" aria-pressed="${f.formality===n}"><b>${n}</b><span>${FORMALITY_SHORT[n]}</span></button>`).join('')}</div>`),
    row('weight', 'Weight', `<div class="seg c3" id="af-weight">${['light','mid','heavy'].map(v => `<button type="button" data-v="${v}" aria-pressed="${f.weight===v}">${cap(v)}</button>`).join('')}</div>`),
    row('season_tags', 'Seasons', `<div class="chips" id="af-season_tags" style="justify-content:flex-start">${SEASONS.map(s => `<button type="button" class="chip" data-v="${s}" aria-pressed="${f.season_tags.includes(s)}">${cap(s)}</button>`).join('')}</div>`),
    row('unit_price', 'Price', `<input class="input" id="af-unit_price" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(f.unit_price ?? '')}" placeholder="What you paid, or leave blank">`),
    row('purchase_date', 'Bought', `<input class="input" id="af-purchase_date" type="date" value="${esc(f.purchase_date ?? '')}">`),
    row('retailer', 'Retailer', text('retailer', 'Shop or site')),
    row('location', 'Where it lives', `<select class="input" id="af-location"><option value="">At home, spot unknown</option>${LOCATIONS.map(l => `<option ${f.location===l?'selected':''}>${l}</option>`).join('')}</select>`),
    row('notes', 'Notes', `<textarea class="input" id="af-notes" placeholder="Nicknames, fit notes, anything searchable">${esc(f.notes ?? '')}</textarea>`),
  ].join('');

  const s = a.saved;
  const hint = blocked ? 'Check the possible duplicates above first'
    : s?.failed ? `Saved as ${tagFor(s.row)}, but could not ${s.failed}. Retry finishes it.`
    : 'Nothing is saved until you tap Save';
  return `<div class="sheet-body" id="ad-body" style="padding-top:14px"><div class="stack" style="gap:14px">${thumbs}${errBanner}${dupBanner}${receipts}<div>${fields}</div></div></div>
    <div class="sheet-foot"><div class="tally small ${s?.failed?'':'muted'}" id="ad-hint" ${s?.failed?'style="color:var(--warn)"':''}>${esc(hint)}</div><button class="btn primary" id="ad-save" ${blocked?'disabled':''}>${s?.id ? 'Retry' : 'Save'}</button></div>`;
}
function drawAdder(){
  const a = adder; if (!a) return;
  const keepScroll = $('#ad-body')?.scrollTop || 0;
  const head = `<div class="sheet-head"><div class="between" style="align-items:center"><button type="button" class="linkbtn" id="ad-cancel" style="padding-left:0">${a.saved?.id ? 'Close' : 'Cancel'}</button><span class="lbl">${a.step==='form' ? 'New item' : 'Add item'}</span></div></div>`;
  let body;
  if (a.step === 'capture'){
    const slot = (p, id, label, sub) => p
      ? `<div class="slot filled"><img src="${esc(p.url)}" alt="${esc(label)}"><button type="button" class="x" data-remove="${id}" aria-label="Remove ${esc(label)}">×</button></div>`
      : `<button type="button" class="slot" data-slot="${id}"><span class="plus">+</span><span>${esc(label)}</span><span class="sub">${esc(sub)}</span></button>`;
    body = `<div class="sheet-body" style="padding-top:16px"><div class="stack">
      <div class="capgrid">${slot(a.item, 'item', 'Item photo', 'required')}<div class="capcol">${slot(a.labels[0], 'label0', 'Label', 'optional')}${slot(a.labels[1], 'label1', 'Second label', 'optional')}</div></div>
      <button type="button" class="linkbtn" id="ad-library" style="padding-left:0">${a.item ? 'Replace the item photo from your library' : 'Or choose the item photo from your library'}</button>
      <div class="hint">Item first. Add the label or tag if you have it: that's where brand, size and fabric come from.</div>
      <button type="button" class="btn primary big" id="ad-identify" ${a.item ? '' : 'disabled'}>Identify</button>
      <button type="button" class="btn" id="ad-manual" ${a.item ? '' : 'disabled'}>Fill in by hand</button>
    </div></div>`;
  } else if (a.step === 'loading'){
    body = `<div class="sheet-body"><div class="stack" style="align-items:center;text-align:center;padding-top:64px">
      <img src="${esc(a.item.url)}" alt="" style="width:132px;height:176px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">
      <div style="font-size:20px;font-weight:600">Reading the photo…</div>
      <div class="hint">Usually under ten seconds. <span id="ad-secs"></span></div>
      <button type="button" class="btn" id="ad-stop">Stop and go back</button>
    </div></div>`;
  } else body = adderFormHTML();
  $('#layer2').innerHTML = `<div class="sheet top" role="dialog" aria-label="Add item">${head}${body}</div>`;
  fitAdder();
  if ($('#ad-body')) $('#ad-body').scrollTop = keepScroll;
  bindAdder();
}
function bindAdder(){
  const a = adder;
  $('#ad-cancel').onclick = () => {
    if (a.step === 'form' && !a.saved?.id && !confirm('Discard this new item?')) return;
    const savedId = a.saved?.id; closeAdder(); if (savedId){ itemUI.id = null; go(`#/item/${savedId}`); }
  };
  if (a.step === 'capture'){
    $$('#layer2 [data-slot]').forEach(b => b.onclick = () => takeAdderPhoto(b.dataset.slot === 'item' ? 'item' : 'label', true));
    $$('#layer2 [data-remove]').forEach(b => b.onclick = () => {
      if (b.dataset.remove === 'item'){ URL.revokeObjectURL(a.item.url); a.item = null; }
      else { const i = Number(b.dataset.remove.slice(5)); URL.revokeObjectURL(a.labels[i].url); a.labels.splice(i, 1); }
      drawAdder();
    });
    $('#ad-library').onclick = () => takeAdderPhoto('item', false);
    $('#ad-identify').onclick = identifyAdder;
    $('#ad-manual').onclick = () => { initAdderForm(null); a.step = 'form'; drawAdder(); };
    return;
  }
  if (a.step === 'loading'){
    const tick = () => { const el = $('#ad-secs'); if (el) el.textContent = Math.round((Date.now() - a.t0) / 1000) + ' s'; };
    clearInterval(a.timer); a.timer = setInterval(tick, 1000); tick();
    $('#ad-stop').onclick = () => a.abort?.abort();
    return;
  }
  // ---- form
  const f = a.form;
  const touched = k => { delete a.ai[k]; const r = $(`#layer2 .frow[data-k="${k}"]`); if (!r) return; r.classList.remove('low'); r.querySelector('.ai')?.remove(); if (ADDER_NEED.includes(k)) r.classList.toggle('need', !String(f[k] ?? '').trim()); };
  $$('#layer2 .frow .input').forEach(el => {
    const k = el.id.slice(3);
    const on = () => { f[k] = el.value; touched(k); };
    el.addEventListener('input', on); el.addEventListener('change', on);
    el.addEventListener('focus', () => setTimeout(() => el.scrollIntoView({ block:'center', behavior:'smooth' }), 280));
  });
  for (const k of ['formality','weight']) $$(`#af-${k} button`).forEach(b => b.onclick = () => {
    f[k] = k === 'formality' ? Number(b.dataset.v) : b.dataset.v;
    $$(`#af-${k} button`).forEach(x => x.setAttribute('aria-pressed', x === b)); touched(k);
  });
  $$('#af-season_tags .chip').forEach(c => c.onclick = () => {
    const v = c.dataset.v; f.season_tags = f.season_tags.includes(v) ? f.season_tags.filter(s => s !== v) : [...f.season_tags, v];
    c.setAttribute('aria-pressed', f.season_tags.includes(v)); touched('season_tags');
  });
  $('#ad-dup-dismiss')?.addEventListener('click', () => { readAdderForm(); a.dupDismissed = true; drawAdder(); });
  $$('#layer2 [data-dup-open]').forEach(b => b.onclick = () => {
    if (!confirm('Discard this new item and open the existing one?')) return;
    const id = Number(b.dataset.dupOpen); closeAdder(); if (picker) closePicker(); itemUI.id = null; go(`#/item/${id}`);
  });
  $$('#layer2 [data-dup-photo]').forEach(b => b.onclick = () => addPhotoToExisting(Number(b.dataset.dupPhoto), b));
  $$('#layer2 [data-receipt]').forEach(b => b.onclick = () => {
    readAdderForm(); const r = a.receipts.find(x => x.id === Number(b.dataset.receipt)); if (!r) return;
    a.receiptId = r.id;
    f.unit_price = r.unit_price != null ? String(r.unit_price) : ''; f.purchase_date = r.order_date || ''; f.retailer = r.retailer || '';
    drawAdder();
  });
  $('#ad-receipt-none')?.addEventListener('click', () => {
    readAdderForm(); const r = a.receipts.find(x => x.id === a.receiptId); a.receiptId = null;
    if (r){ // clear only what the receipt filled in
      if (Number(f.unit_price) === Number(r.unit_price)) f.unit_price = '';
      if (f.purchase_date === (r.order_date || '')) f.purchase_date = '';
      if (f.retailer === (r.retailer || '')) f.retailer = '';
    }
    drawAdder();
  });
  $('#ad-save').onclick = saveAdder;
}
async function addPhotoToExisting(id, btn){
  const a = adder, it = state.itemById.get(id);
  if (!it) return toast('That item is not loaded here');
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    const path = `${photoPrefix(it)}${slug(it.name)}-own-${stamp()}.jpg`;
    await uploadBlob(path, a.item.blob, false);
    if (!it.photo_ref){
      const patch = { photo_ref:path, photo_source:'own_photo' };
      if (a.item.hex) Object.assign(patch, { swatch_hex:a.item.hex, swatch_source:'photo' });
      await updateItem(id, patch);
    }
    closeAdder(); if (picker) closePicker(); itemUI.id = null; toast('Photo added to the existing item');
    if (location.hash === `#/item/${id}`) render(); else go(`#/item/${id}`);
  } catch (e) { fail('add the photo', e); btn.disabled = false; btn.textContent = 'Add this photo to it'; }
}
/* Save runs in order and is resumable: if a step fails, the hint names it and Retry picks up there. */
async function saveAdder(){
  const a = adder; if (!a || a.busy) return;
  readAdderForm(); const f = a.form;
  if (!String(f.name).trim()){ toast('Give it a name first'); $('#af-name')?.focus(); return; }
  const priceStr = String(f.unit_price ?? '').trim(), price = priceStr === '' ? null : Number(priceStr);
  if (price !== null && !(price >= 0)){ toast('Price must be a number'); $('#af-unit_price')?.focus(); return; }
  a.busy = true; const btn = $('#ad-save'); btn.disabled = true; btn.textContent = 'Saving…';
  const s = a.saved || (a.saved = { id:null, row:null, done:{}, labels:{}, failed:null });
  let step = '';
  try {
    if (!s.id){
      step = 'create the item';
      const cat = state.catById.get(Number(f.category_id)) || null;
      const parent = cat ? (cat.parent_id ? state.catById.get(cat.parent_id) : cat) : null;
      const rec = a.receipts.find(r => r.id === a.receiptId) || null;
      const colour = String(f.colour || '').trim();
      const row = {
        name: f.name.trim(), brand: nz(f.brand),
        colors: !colour ? [] : (a.draft && colour === a.draft.colour_name && a.draft.colors?.length ? a.draft.colors : [colour.toLowerCase()]),
        category_id: cat ? cat.id : null, layer: cat?.default_layer || a.draft?.layer || null,
        size: nz(f.size), material: nz(f.material), team_id: f.team_id ? Number(f.team_id) : null,
        formality: f.formality || null, weight: f.weight || null, season_tags: f.season_tags || [],
        unit_price: price,
        // receipt price, or what Joe typed, or nothing. Never an estimate.
        price_source: price === null ? 'unknown' : (rec && Number(rec.unit_price) === price ? 'receipt' : 'manual'),
        purchase_date: f.purchase_date || null, retailer: nz(f.retailer), location: f.location || null, notes: nz(f.notes),
        item_class: parent?.name === 'Collection' ? 'collectible' : parent?.name === 'Property' ? 'property' : 'wardrobe',
        status:'active', source:'app', acquired_how: (rec || price !== null) ? 'bought' : 'unknown', photo_source:'none',
      };
      const { data, error } = await sb.from('items').insert(row).select(ITEM_COLS).single();
      if (error) throw error;
      s.id = data.id; s.row = data; setItems([...state.items, data]);
    }
    const base = `${photoPrefix(s.row)}${slug(s.row.name)}`;
    if (!s.done.photo){
      step = 'upload the item photo';
      s.photoPath = s.photoPath || `${base}-own-${stamp()}.jpg`;
      await uploadBlob(s.photoPath, a.item.blob, true); s.done.photo = true;
    }
    for (let i = 0; i < a.labels.length; i++){
      if (s.labels[i]) continue;
      step = 'upload the label photo';
      await uploadBlob(`${base}-label-${stamp()}${i}.jpg`, a.labels[i].blob, true); s.labels[i] = true;
    }
    if (!s.done.cover){
      step = 'set the cover and colour';
      const patch = { photo_ref:s.photoPath, photo_source:'own_photo' };
      if (a.item.hex) Object.assign(patch, { swatch_hex:a.item.hex, swatch_source:'photo' });
      s.row = await updateItem(s.id, patch); s.done.cover = true;
    }
    if (a.receiptId && !s.done.receipt){
      step = 'link the receipt';
      const { error } = await sb.from('acquisitions').update({ matched_item_id:s.id }).eq('id', a.receiptId).is('matched_item_id', null);
      if (error) throw error; s.done.receipt = true;
    }
    const id = s.id, tag = tagFor(s.row), fromPicker = a.fromPicker;
    closeAdder(); itemUI.id = null; toast(`Added — ${tag}`);
    if (fromPicker && picker){ picker.picked.add(id); picker.query = ''; drawPicker(); }
    else if (location.hash === `#/item/${id}`) render(); else go(`#/item/${id}`);
  } catch (e) {
    a.busy = false; s.failed = step; drawAdder(); fail(step, e);
  }
}

/* ------------------------------------------------------------
   Auth + start
   ------------------------------------------------------------ */
function showAuth(){
  $('#layer').innerHTML = `<div class="sheet" role="dialog" aria-label="Sign in"><div class="sheet-body" style="padding-top:calc(var(--sat) + 60px)"><div class="stack">
    <div class="stack tight"><div class="lbl">Wardrobe</div><h1>Sign in</h1><div class="hint">Once per device. You stay signed in.</div></div>
    <form id="authform" class="stack tight" style="gap:12px">
      <input class="input" type="email" id="email" placeholder="Email" autocomplete="username" required>
      <input class="input" type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
      <button class="btn primary big" type="submit" id="signin">Sign in</button>
    </form>
    <div id="autherr" class="small" style="color:var(--warn)"></div>
  </div></div></div>`;
  $('#authform').onsubmit = async e => {
    e.preventDefault(); const b=$('#signin'); b.disabled=true; b.textContent='Signing in…'; $('#autherr').textContent='';
    const { error } = await sb.auth.signInWithPassword({ email:$('#email').value.trim(), password:$('#pw').value });
    if (error){ $('#autherr').textContent = error.message; b.disabled=false; b.textContent='Sign in'; }
    // success: onAuthStateChange → start()
  };
}
let starting = false;
async function start(){
  if (state.ready || starting) return; starting = true;
  $('#layer').innerHTML = '';
  $('#view').innerHTML = '<div class="loading">Loading your closet</div>';
  try { await loadAll(); state.ready = true; render(); }
  catch(e){ fail('load your closet', e); $('#view').innerHTML = `<div class="stack"><h1 class="sm">Couldn't load</h1><div class="hint">${esc(e.message||e)}</div><button class="btn" onclick="location.reload()">Reload</button></div>`; }
  finally { starting = false; }
}
async function main(){
  sb.auth.onAuthStateChange((_ev, session) => { if (session) start(); else if (state.ready) { state.ready=false; showAuth(); } });
  const { data:{ session } } = await sb.auth.getSession();
  if (session) start(); else showAuth();
  if (!location.hash) location.hash = '#/today';
}
main();
</script>
